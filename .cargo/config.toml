# Build Raven Glass from the RavenGUI checkout beside this one rather than the
# copy on GitHub, so a change to the shared look is tried here before it is
# pushed. The image build checks every app out beside RavenGUI, so it takes
# this path too. Delete this file to use the git dependency as it is.
