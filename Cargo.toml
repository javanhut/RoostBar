[package]
name = "roostbar"
version = "0.1.0"
edition = "2021"
description = "A thin, glanceable status bar for Huginn on Raven Linux"

[dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
wayland-client = "0.31"
wayland-backend = "0.3"
wayland-scanner = "0.31"
calloop = "0.14"
calloop-wayland-source = "0.4"
ab_glyph = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
alsa = "0.9"
serde_json = "1"
pipewire = { version = "0.8", optional = true }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[features]
default = []
# Native libpipewire backend. Needs libclang at build time (`rvn install clang`).
pipewire-native = ["dep:pipewire"]

[profile.release]
opt-level = 2
lto = "thin"
strip = true
